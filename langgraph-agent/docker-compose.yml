version: '3.8'

services:
  langgraph-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: langgraph-agent:1.0.0
    container_name: langgraph-agent
    ports:
      - "8000:8000"
    environment:
      # ICA Configuration
      - ICA_API_KEY=${ICA_API_KEY}
      - ICA_API_BASE=${ICA_API_BASE:-https://agentstudio.servicesessentials.ibm.com}
      - ICA_ORGANIZATION_ID=${ICA_ORGANIZATION_ID}
      - ICA_PROJECT_ID=${ICA_PROJECT_ID}
      - ICA_CONTEXT_ID=${ICA_CONTEXT_ID}
      - ICA_USE_CONTEXT_STUDIO=${ICA_USE_CONTEXT_STUDIO:-true}
      
      # OpenAI-compatible
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://agentstudio.servicesessentials.ibm.com/api/v1}
      
      # Agent Configuration
      - AGENT_NAME=${AGENT_NAME:-agentic-devops-langgraph}
      - AGENT_VERSION=${AGENT_VERSION:-1.0.0}
      - AGENT_PORT=8000
      - AGENT_HOST=0.0.0.0
      
      # Model Configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-5.2-chat}
      - MODEL_TEMPERATURE=${MODEL_TEMPERATURE:-0.7}
      
      # OTEL Configuration
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-langgraph-agent}
      
      # MCP Configuration
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_VIRTUAL_SERVER_ID=${MCP_VIRTUAL_SERVER_ID}
      
      # A2A Protocol
      - A2A_ENABLED=${A2A_ENABLED:-true}
      - AUTO_REGISTRATION_ENABLED=${AUTO_REGISTRATION_ENABLED:-true}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
    env_file:
      - .env
    
    volumes:
      # Mount logs directory
      - ./logs:/app/logs
      # Mount source code for development (comment out for production)
      # - ./src:/app/src
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - langgraph-network
    
    labels:
      - "com.langgraph.agent=true"
      - "com.langgraph.version=1.0.0"
      - "com.langgraph.framework=langgraph"
      - "com.langgraph.platform=enterprise_advantage"

networks:
  langgraph-network:
    driver: bridge
    name: langgraph-network

